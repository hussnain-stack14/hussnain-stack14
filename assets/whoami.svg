<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 20px; }
    .n  { fill: #475569; }
    .k  { fill: #C084FC; }
    .v  { fill: #67E8F9; }
    .p  { fill: #7DD3FC; }
    .s  { fill: #86EFAC; }
    .b  { fill: #FBBF24; }
    .c  { fill: #94A3B8; }
    .l  { opacity: 0; animation: in 0.5s ease forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .cursor { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
  </style>

  <rect width="1100" height="420" rx="14" fill="#0B1220"/>
  <rect x="0.5" y="0.5" width="1099" height="419" rx="14" fill="none" stroke="#22D3EE" stroke-opacity="0.35"/>

  <circle cx="28" cy="24" r="7" fill="#FF5F56"/>
  <circle cx="52" cy="24" r="7" fill="#FFBD2E"/>
  <circle cx="76" cy="24" r="7" fill="#27C93F"/>
  <text x="550" y="30" text-anchor="middle" style="font-size:14px" class="c">whoami.js</text>
  <line x1="0" y1="48" x2="1100" y2="48" stroke="#1F2937"/>

  <!-- status badge -->
  <circle class="dot" cx="905" cy="25" r="5" fill="#27C93F"/>
  <text x="920" y="30" style="font-size:14px" fill="#86EFAC">open to work</text>

  <g>
    <text class="l" style="animation-delay:0.2s" x="40" y="95"><tspan class="n">1</tspan><tspan x="90" class="k">const </tspan><tspan class="v">hussnain </tspan><tspan class="c">= {</tspan></text>
    <text class="l" style="animation-delay:0.4s" x="40" y="127"><tspan class="n">2</tspan><tspan x="114" class="p">role</tspan><tspan class="c">: </tspan><tspan class="s">"Full Stack Developer"</tspan><tspan class="c">,</tspan></text>
    <text class="l" style="animation-delay:0.6s" x="40" y="159"><tspan class="n">3</tspan><tspan x="114" class="p">education</tspan><tspan class="c">: </tspan><tspan class="s">"BS Software Engineering @ NUML Faisalabad"</tspan><tspan class="c">,</tspan></text>
    <text class="l" style="animation-delay:0.8s" x="40" y="191"><tspan class="n">4</tspan><tspan x="114" class="p">stack</tspan><tspan class="c">: [</tspan><tspan class="s">"Next.js"</tspan><tspan class="c">, </tspan><tspan class="s">"React"</tspan><tspan class="c">, </tspan><tspan class="s">"Node.js"</tspan><tspan class="c">, </tspan><tspan class="s">"Express"</tspan><tspan class="c">, </tspan><tspan class="s">"MongoDB"</tspan><tspan class="c">],</tspan></text>
    <text class="l" style="animation-delay:1.0s" x="40" y="223"><tspan class="n">5</tspan><tspan x="114" class="p">building</tspan><tspan class="c">: </tspan><tspan class="s">"Smart Safar: real-time transit tracking for Faisalabad"</tspan><tspan class="c">,</tspan></text>
    <text class="l" style="animation-delay:1.2s" x="40" y="255"><tspan class="n">6</tspan><tspan x="114" class="p">developing</tspan><tspan class="c">: </tspan><tspan class="s">"Crease: offline-first cricket scoring PWA"</tspan><tspan class="c">,</tspan></text>
    <text class="l" style="animation-delay:1.4s" x="40" y="287"><tspan class="n">7</tspan><tspan x="114" class="p">exploring</tspan><tspan class="c">: [</tspan><tspan class="s">"AWS"</tspan><tspan class="c">, </tspan><tspan class="s">"CI/CD"</tspan><tspan class="c">, </tspan><tspan class="s">"Cloud Deployment"</tspan><tspan class="c">],</tspan></text>
    <text class="l" style="animation-delay:1.6s" x="40" y="319"><tspan class="n">8</tspan><tspan x="114" class="p">openTo</tspan><tspan class="c">: [</tspan><tspan class="s">"Internships"</tspan><tspan class="c">, </tspan><tspan class="s">"Collaboration"</tspan><tspan class="c">, </tspan><tspan class="s">"Freelance projects"</tspan><tspan class="c">],</tspan></text>
    <text class="l" style="animation-delay:1.8s" x="40" y="351"><tspan class="n">9</tspan><tspan x="114" class="p">available</tspan><tspan class="c">: </tspan><tspan class="b">true</tspan><tspan class="c">,</tspan></text>
    <text class="l" style="animation-delay:2.0s" x="40" y="383"><tspan class="n">10</tspan><tspan x="90" class="c">};</tspan></text>
  </g>
  <rect class="cursor" x="125" y="367" width="11" height="22" fill="#22D3EE"/>
</svg>
